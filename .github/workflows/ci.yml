name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies & Check Syntax
      run: |
        python -m pip install --upgrade pip
        # Strip hashes to prevent build issues
        python -c "import sys; lines=[l.split('--hash')[0].strip() for l in open('requirements.txt') if l.strip()]; open('clean_requirements.txt','w').write('\n'.join(lines))"
        pip install -r clean_requirements.txt
        # Syntax check on python files
        python -m py_compile app.py

    - name: Build Docker Image
      run: |
        docker build -t yolo-football-tracker:latest .